<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario - SDD/TDD</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #eee;
    }
    h1 { margin: 0 0 12px; font-size: 20px; }
    #game {
      border: 2px solid #555;
      image-rendering: pixelated;
      background: #5c94fc;
    }
    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Super Mario</h1>
  <canvas id="game" width="800" height="480"></canvas>
  <div class="hint">
    ← → 移动 | ↑/Space 跳跃 | P 暂停 | Enter 开始 | R 重开
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
